name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with the project key when the secrets exist, otherwise the
      # build falls back to the debug key (see app/build.gradle.kts).
      - name: Restore release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > rawvision.jks
          cat > keystore.properties <<PROPS
          storeFile=rawvision.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename artifact
        run: cp app/build/outputs/apk/release/app-release.apk "RAWVision-Camera-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RAWVision-Camera-*.apk
          generate_release_notes: true
